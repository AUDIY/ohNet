name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: add repository
      run: sudo add-apt-repository ppa:dotnet/backports
    - name: install dependencies
      run: sudo apt install -y dotnet-sdk-9.0 openjdk-8-jdk python-is-python3
    - name: make
      run: make
    - name: make install
      run: make install
